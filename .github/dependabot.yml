# dependabot config

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      k8s-io:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-artifacts:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "actions/github-script"
      # All codeql-action steps in a workflow must run the same version, so bump
      # them together instead of one step per PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
